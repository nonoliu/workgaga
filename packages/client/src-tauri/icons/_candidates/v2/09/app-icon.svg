    <circle cx="512" cy="512" r="188" stroke="url(#ring)" stroke-width="10" opacity="0.55"/>
    <path d="M176 512H848" stroke="url(#beam)" stroke-width="40" stroke-linecap="round"/>

    <path d="M290 420C372 338 652 338 734 420" stroke="#BFA8FF" stroke-opacity="0.6" stroke-width="18" stroke-linecap="round"/>
    <path d="M290 604C372 686 652 686 734 604" stroke="#E2B7FF" stroke-opacity="0.5" stroke-width="18" stroke-linecap="round"/>

    <ellipse cx="512" cy="512" rx="458" ry="260" stroke="#3B2B8F" stroke-opacity="0.25" stroke-width="18"/>
  </g>
