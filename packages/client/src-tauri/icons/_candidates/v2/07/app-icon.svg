      <stop offset="0.5" stop-color="#7C5CFF" stop-opacity="1"/>
      <stop offset="0.78" stop-color="#F2C1FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F2C1FF" stop-opacity="0"/>
