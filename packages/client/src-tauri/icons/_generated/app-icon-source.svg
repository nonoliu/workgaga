  </defs>

  <rect width="1024" height="1024" rx="220" fill="#050615" />

  <g filter="url(#glow)">
    <circle cx="512" cy="512" r="212" stroke="url(#g1)" stroke-width="56" />
    <circle cx="512" cy="512" r="150" stroke="url(#g1)" stroke-width="10" opacity="0.75" />
    <circle cx="512" cy="512" r="152" fill="#050615" opacity="0.95" />
    <path d="M176 512H848" stroke="url(#g2)" stroke-width="40" stroke-linecap="round" />
