<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="256" y1="256" x2="768" y2="768" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFF" />
      <stop offset="1" stop-color="#E2B7FF" />
    </linearGradient>
    <linearGradient id="g2" x1="128" y1="512" x2="896" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A98CFF" stop-opacity="0" />
      <stop offset="0.2" stop-color="#A98CFF" stop-opacity="0.95" />
      <stop offset="0.8" stop-color="#E2B7FF" stop-opacity="0.95" />
      <stop offset="1" stop-color="#E2B7FF" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14" result="b" />
      <feColorMatrix
